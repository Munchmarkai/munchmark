<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Munchmark Stomach Demo</title>
<link rel="stylesheet" href="css/app.css">
<!--demo-head-->
<style>
/* Demo page: the new Today card and color pages on sample food. Nothing here touches a real log. */
.app{padding-bottom:40px}
.demo-pill{font-size:12px;font-weight:700;border:2px solid var(--stroke);border-radius:999px;padding:3px 10px;background:var(--yellow);color:var(--pop-ink)}
.demo-panel{background:var(--brand);color:var(--brand-ink);margin:0 -16px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}
.demo-panel h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px}
.demo-panel p{margin:0;font-size:13.5px;opacity:.92}
.demo-panel .lbl{font-size:12.5px;opacity:.85}
.demo-foods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo-food{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-height:52px;padding:8px 12px;background:var(--surface);color:var(--ink);border:2px solid var(--stroke);border-radius:var(--wob-sm);font-weight:650;font-size:14px}
.demo-food small{font-weight:500;font-size:12px;color:var(--muted)}
.demo-food:active{transform:translate(1px,2px)}
.demo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-panel .btn.ghost{background:transparent;color:var(--brand-ink);border-color:var(--brand-ink)}
.demo-panel .seg{background:color-mix(in oklab,var(--brand-ink) 16%,transparent)}
.demo-panel .seg button{color:var(--brand-ink)}
.demo-panel .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.demo-meal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1.5px dashed var(--line)}
.demo-meal b{display:block;font-weight:650}
.demo-meal small{color:var(--muted);font-size:12.5px}
.demo-meal .k{font-family:var(--f-display);font-weight:800;font-size:18px}
.demo-meal.flash{animation:demo-flash 1.2s ease}
@keyframes demo-flash{0%,40%{background:var(--yellow);color:var(--pop-ink)}}
@media (prefers-reduced-motion: reduce){.demo-meal.flash{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" aria-label="Munchmark">
      <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><defs><mask id="brand-bite" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="#fff"/><circle cx="79.5" cy="11.8" r="14" fill="#000"/><circle cx="96.8" cy="23.2" r="14" fill="#000"/><circle cx="108.2" cy="40.5" r="14" fill="#000"/></mask></defs><circle cx="60" cy="60" r="50" fill="currentColor" mask="url(#brand-bite)"/><path class="mark-check" d="M34 62 L51 78 L81 46" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="wordmark" aria-hidden="true">munch<span>mark</span></span>
    </div>
    <span class="demo-pill">Demo · sample food</span>
  </header>

  <section class="view" id="view-today" aria-label="Daily log">
    <div class="tum-sum">
      <p class="kcal-line"><b class="kcal-big tnum" id="kcal-left">2,200</b><span class="kcal-lbl" id="kcal-left-lbl">kcal left</span></p>
      <div id="tummy"></div>
      <p class="tap-hint">Tap a color to see what filled it.</p>
      <div class="sum-foot tnum"><span>Eaten <b id="kcal-eaten">0</b></span><span>Goal <b id="kcal-goal">2,200</b> kcal</span></div>
    </div>

    <div class="demo-panel">
      <h2>Feed the stomach</h2>
      <p>Each food pours in as its own mix of protein, carbs and fat. Full means you’ve hit the day’s calories.</p>
      <div class="demo-foods" id="demo-foods"></div>
      <div class="demo-row">
        <button type="button" class="btn ghost sm" id="demo-empty">Empty it</button>
        <button type="button" class="btn ghost sm" id="demo-reset">Sample day</button>
      </div>
      <span class="lbl" id="demo-theme-lbl">Light or dark</span>
      <div class="seg" role="group" aria-labelledby="demo-theme-lbl">
        <button type="button" data-theme-pick="auto">Auto</button>
        <button type="button" data-theme-pick="light">Light</button>
        <button type="button" data-theme-pick="dark">Dark</button>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head"><h2 class="h">Meals</h2><span class="sub" id="demo-count"></span></div>
      <div id="meals"></div>
    </div>
  </section>

  <section class="view" id="view-macro" aria-label="What added to this macro" hidden></section>
</div>

<script type="module">
import { stomachHTML, updateStomach, macroPageHTML } from './js/tummy.js';

const $ = s => document.querySelector(s);
const int = n => Math.round(n).toLocaleString();
// sample foods: [name, portion, protein g, carbs g, fat g, calories]
const FOODS = [
  ['Eggs and toast', '2 eggs, 2 slices', 18, 27, 13, 300],
  ['Chicken and rice', '1 bowl', 42, 55, 9, 470],
  ['Pizza', '2 slices', 24, 66, 20, 540],
  ['Greek yogurt', '1 cup', 20, 9, 5, 160],
  ['Avocado', '1 whole', 4, 17, 29, 320],
  ['Banana', '1 medium', 1, 27, 0, 105],
  ['Peanut butter', '2 tbsp', 7, 8, 16, 190],
  ['Glass of wine', '5 oz', 0, 4, 0, 125],
];
const MEAL = ['Breakfast', 'Lunch', 'Dinner', 'Snack', 'Snack', 'Snack', 'Snack', 'Dinner'];
const GOALS = {calories:2200, protein_lo:124, protein_hi:152, carbs_g:259, fat_g:68};
const SAMPLE = [0, 5, 1, 3];
let log = SAMPLE.slice(), nextId = 1, macro = 'protein', flash = null;
let entries = log.map(i => ({id:'d' + nextId++, food:i}));

function totals(){
  const t = {calories:0, protein_g:0, carbs_g:0, fat_g:0};
  for (const e of entries) { const f = FOODS[e.food]; t.protein_g += f[2]; t.carbs_g += f[3]; t.fat_g += f[4]; t.calories += f[5]; }
  return t;
}
function render(){
  const t = totals(), left = GOALS.calories - t.calories;
  const tum = $('#tummy'); if (!tum.firstElementChild) tum.innerHTML = stomachHTML();
  updateStomach(tum.firstElementChild, t, GOALS.calories);
  $('#kcal-left').textContent = int(Math.abs(left));
  $('#kcal-left-lbl').textContent = left < 0 ? 'kcal over' : 'kcal left';
  $('#kcal-left-lbl').classList.toggle('over', left < 0);
  $('#kcal-eaten').textContent = int(t.calories);
  $('#kcal-goal').textContent = int(GOALS.calories);
  $('#demo-count').textContent = entries.length ? `${entries.length} logged` : '';
  $('#meals').innerHTML = entries.length ? entries.map(e => { const f = FOODS[e.food]; return `<div class="demo-meal${flash === e.id ? ' flash' : ''}" data-entry="${e.id}"><span><b>${f[0]}</b><small>${MEAL[e.food]} · ${f[1]} · P ${f[2]} · C ${f[3]} · F ${f[4]}</small></span><span class="k tnum">${f[5]}</span></div>`; }).join('')
    : '<div class="empty"><b>Nothing logged yet</b><p>Tap a food above and watch it pour in.</p></div>';
  flash = null;
}
function renderMacro(){
  const k = macro === 'protein' ? 2 : macro === 'carbs' ? 3 : 4;
  const rows = entries.map(e => { const f = FOODS[e.food]; return {entryId:e.id, name:f[0], sub:`${MEAL[e.food]} · ${f[1]}`, grams:f[k]}; });
  $('#view-macro').innerHTML = macroPageHTML({macro, t:totals(), g:GOALS, rows, dayLabel:'Today'});
}
function show(view){
  $('#view-today').hidden = view !== 'today'; $('#view-macro').hidden = view !== 'macro';
  if (view === 'macro') renderMacro(); else render();
  window.scrollTo({top:0});
}
$('#demo-foods').innerHTML = FOODS.map((f, i) => `<button type="button" class="demo-food" data-food="${i}"><span>+ ${f[0]}</span><small>${f[5]} kcal</small></button>`).join('');

document.addEventListener('click', ev => {
  const food = ev.target.closest('[data-food]');
  if (food) { entries.push({id:'d' + nextId++, food:Number(food.dataset.food)}); render(); return; }
  const pick = ev.target.closest('[data-theme-pick]');
  if (pick) { setTheme(pick.dataset.themePick); return; }
  const b = ev.target.closest('[data-action]'); if (!b) return;
  if (b.dataset.action === 'macro') { macro = b.dataset.macro; show('macro'); }
  else if (b.dataset.action === 'macro-back' || b.dataset.action === 'tab') show('today');
  else if (b.dataset.action === 'macro-entry') { flash = b.dataset.id; show('today'); document.querySelector(`[data-entry="${b.dataset.id}"]`)?.scrollIntoView({block:'center'}); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('svg [role="button"]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); } });
$('#demo-empty').addEventListener('click', () => { entries = []; render(); });
$('#demo-reset').addEventListener('click', () => { entries = SAMPLE.map(i => ({id:'d' + nextId++, food:i})); render(); });

// Auto leaves the choice to the device (or to whatever is showing this page)
const root = document.documentElement, hostTheme = root.getAttribute('data-theme');
function setTheme(t){
  if (t === 'auto') { if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', t);
  document.querySelectorAll('[data-theme-pick]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themePick === t)));
}
setTheme('auto');
render();
</script>
</body>
</html>
